
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ẩm Thực Hằng Nga</title>
<style>
*{box-sizing:border-box;font-family:Arial}
body{margin:0;background:#f5f6fa;color:#333}
header{background:#ff6b35;color:white;padding:18px 7%}
.top{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap}
.logo{font-size:25px;font-weight:bold}
input,textarea{padding:12px;border:1px solid #ddd;border-radius:6px;width:100%;margin:6px 0}
.search{max-width:400px}
button{cursor:pointer;border:0;padding:11px 16px;border-radius:6px;background:#ff6b35;color:white}
.banner{text-align:center;background:#ffe5d8;padding:45px 15px}
.banner h1{color:#e85d2a}
.container{padding:30px 7%}
.categories{display:flex;gap:10px;flex-wrap:wrap;margin:20px 0}
.products{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.product,.cart{background:white;padding:15px;border-radius:10px}
.product img{width:100%;height:170px;object-fit:cover;border-radius:7px}
.price{color:#ff6b35;font-weight:bold;font-size:19px}
.product button{width:100%}
.cart{margin-top:30px}
.item{display:flex;justify-content:space-between;gap:10px;padding:12px 0;border-bottom:1px solid #eee}
.total{text-align:right;font-size:20px;font-weight:bold;margin:20px 0}
form{max-width:550px}
footer{text-align:center;background:#333;color:white;padding:25px}
@media(max-width:850px){.products{grid-template-columns:repeat(2,1fr)}}
@media(max-width:500px){.products{grid-template-columns:1fr}}
</style>
</head>
<body>

<header>
<div class="top">
<div class="logo">Ẩm Thực Hằng Nga</div>
<div class="search">
<input id="search" placeholder="Tìm kiếm sản phẩm...">
</div>
<button onclick="document.getElementById('cart').scrollIntoView()">
Giỏ hàng (<span id="count">0</span>)
</button>
</div>
</header>

<section class="banner">
<h1>MUA SẮM DỄ DÀNG</h1>
<p>Sản phẩm chất lượng - Giá cả hợp lý</p>
<button onclick="document.getElementById('shop').scrollIntoView()">
Mua ngay
</button>
</section>

<main class="container" id="shop">
<h2>Danh mục sản phẩm</h2>
<div class="categories" id="categories"></div>

<h2>Sản phẩm nổi bật</h2>
<div class="products" id="products"></div>

<section class="cart" id="cart">
<h2>Giỏ hàng</h2>
<div id="cartItems">Chưa có sản phẩm.</div>
<div class="total" id="total">Tổng tiền: 0đ</div>

<h2>Thông tin đặt hàng</h2>
<form id="orderForm">
<input id="name" placeholder="Họ và tên" required maxlength="100">
<input id="phone" type="tel" placeholder="Số điện thoại" required maxlength="20">
<textarea id="address" placeholder="Địa chỉ nhận hàng" required maxlength="500"></textarea>
<button type="submit" id="submitOrder">XÁC NHẬN ĐẶT HÀNG</button>
</form>
<p id="message" aria-live="polite"></p>
</section>
</main>

<footer>
<h3>Ẩm Thực Hằng Nga</h3>
<p>Cảm ơn bạn đã mua sắm!</p>
</footer>

<script type="module" src="app.js"></script>
</body>
</html>
